name: Daily Signal
on:
  schedule:
    - cron: "30 10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install yfinance pandas requests
      - run: python update_tickers.py
      - run: python mtp_site.py
      - name: Commit hasil
        run: |
          git config user.name "signal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs tickers.txt
          git commit -m "signal $(date +%F)" || echo "tidak ada perubahan"
          git push
